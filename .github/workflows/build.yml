# Multi-architecture Docker image verification.
#
# We run `docker buildx` for linux/amd64 + linux/arm64 to confirm the
# Dockerfile cross-compiles cleanly. We do NOT push to a registry —
# release publishing is goreleaser's responsibility.
#
# Cache uses GitHub Actions cache backend so subsequent runs reuse the
# compiled Go layers.
#
# Runners: GitHub-hosted `ubuntu-latest`. Every workflow in this repository
# uses hosted runners, deliberately. A public repository must not name
# self-hosted labels: no fork can schedule them, so a contributor's run would
# queue forever, and untrusted fork code must never execute on private
# infrastructure. Hosted minutes are free for public repositories.

name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: docker buildx (linux/amd64,linux/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        # Required so the amd64 runner can emulate arm64 during the build.
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          # `--load` only supports single-platform; we just verify the
          # build succeeds for both platforms.
          load: false
          tags: opentams:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
