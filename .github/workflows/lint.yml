# golangci-lint with the strict configuration in .golangci.yml.
#
# Runs on every PR and every push to main. The action manages its own
# build/lint cache; we set `cache: false` on setup-go so the two don't
# fight over the same paths.
#
# Runners: GitHub-hosted `ubuntu-latest`. Every workflow in this repository
# uses hosted runners, deliberately. A public repository must not name
# self-hosted labels: no fork can schedule them, so a contributor's run would
# queue forever, and untrusted fork code must never execute on private
# infrastructure. Hosted minutes are free for public repositories.

name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  # `pull-requests: read` is what golangci-lint-action uses to post inline
  # annotations; we keep it minimal.
  pull-requests: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # The lint action maintains its own cache for the linter binary
          # and analysis artefacts.
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          # Pin the linter to a known release rather than `latest` so that
          # CI is reproducible and a new linter release cannot turn green
          # PRs red without a config bump.
          #
          # v2.9.0 (Feb 2026) was the first release built with Go 1.26 — our
          # go.mod targets 1.26.6, so any earlier pin fails with
          # "the Go language version (go1.25) used to build golangci-lint
          #  is lower than the targeted Go version (1.26.6)". The floor is
          # the Go minor, not the patch, so v2.11.0 still covers 1.26.6.
          # Revisit when go.mod moves to Go 1.27.
          version: v2.11.0
          args: --timeout=5m
