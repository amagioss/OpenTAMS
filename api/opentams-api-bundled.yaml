    get:
      summary: List Flow Segments
      description: |
        Returns Flow Segments, optionally filtered by timerange and other criteria.
        A request for Segments from a non-existent Flow returns 404 `not-found` — this is a
        deliberate OpenTAMS divergence from TAMS v8 (REQ-BEH-16, which specifies 200 + `[]`).
        Rationale: making missing-flow visible at this endpoint matches the behaviour of every
        other Flow-scoped route (`GET /flows/{flowId}`, `DELETE /flows/{flowId}/segments`) and
        avoids silently returning empty pages when a typo or stale ID would otherwise be hidden.
