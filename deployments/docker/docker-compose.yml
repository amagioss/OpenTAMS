# OpenTAMS dev storage stack — postgres + minio only.
#
# The OpenTAMS server itself runs on the host via `make run` (which
# applies migrations then execs `opentams serve` via `go run`). Running
# the server on the host means its presigned URLs use `localhost:9000`,
# which is reachable from both the server and from any demo client on
# the same host. Putting the server in compose would presign URLs
# against the docker-internal hostname `minio:9000` — not resolvable
# from clients off the docker network. See `scripts/start.sh`.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Published so the host-side server (`make run`) can reach Postgres
    # at localhost:5432.
    ports:
      # Bound to loopback: this is a local dev stack, not a service to expose.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    ports:
      # Bound to loopback: this is a local dev stack, not a service to expose.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-03T17-07-56Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${OBJECT_STORE_ACCESS_KEY_ID} ${OBJECT_STORE_SECRET_ACCESS_KEY} &&
      mc mb --ignore-existing local/${OBJECT_STORE_BUCKET}
      "
    restart: no

volumes:
  postgres_data:
  minio_data:
