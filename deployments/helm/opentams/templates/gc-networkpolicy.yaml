{{- if and .Values.gc.enabled .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opentams.fullname" . }}-gc
  labels:
    {{- include "opentams.gcLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opentams.gcSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- with .Values.networkPolicy.monitoringNamespaceSelector }}
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.server.port }}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
