apiVersion: v1
kind: Pod
metadata:
  name: {{ include "opentams.fullname" . }}-test-connection
  labels:
    {{- include "opentams.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: test
      image: curlimages/curl:latest
      command: ["curl"]
      args:
        - "-sf"
        - "http://{{ include "opentams.fullname" . }}:{{ .Values.service.port }}/readyz"
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
