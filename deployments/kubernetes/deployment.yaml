apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentams
  namespace: opentams
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opentams
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: opentams
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opentams
          # Pin to an immutable digest in production. `:latest` here is a
          # placeholder that will not resolve — replace registry, tag, and
          # digest before applying:
          #   image: ghcr.io/amagioss/opentams:v0.1.0@sha256:<digest>
          image: your-registry/opentams:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: opentams
            - secretRef:
                name: opentams
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
